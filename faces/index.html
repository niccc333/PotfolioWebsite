<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sami Makeup Art — Faces</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kapakana&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark font-cursive" href="/">Faces by Sam</a>
      <nav class="site-nav font-serif">
        <a href="/faces/">faces</a>
        <a href="/">art</a>
        <a href="/contact/">contact</a>
        <a href="/calendar/">calendar</a>
        <a href="/about-me/">about me</a>
      </nav>
    </header>

    <main>
      <section class="shoot" id="snowstorm">
        <h2 class="font-cursive">Snowstorm</h2>
        <p class="font-serif shoot-meta">03/2025 &middot; @nahimmasaint</p>
        <div class="shoot-grid shoot-grid--hero">
          <img class="shoot-grid__hero" src="/Snowstorm1.JPG" alt="" />
          <div class="shoot-grid__pair">
            <img src="/Snowstorm2.JPG" alt="" />
            <img src="/Snowstorm3.JPG" alt="" />
          </div>
        </div>
        <p class="font-serif shoot-meta">@forasterogenesis &middot; @rduransigouin</p>
      </section>

      <section class="shoot" id="gaba-collective">
        <h2 class="font-cursive">GABA Collective &mdash; Subcouture S03</h2>
        <p class="font-serif shoot-meta">Vendredi 18 Septembre 2025, 19:00</p>
        <div class="shoot-grid shoot-grid--quad">
          <img src="/SUBCOUTURE S031.jpeg" alt="" />
          <img src="/SUBCOUTURE S032.jpeg" alt="" />
          <img src="/SUBCOUTURE S033.JPG" alt="" />
          <img src="/SUBCOUTURE S034.JPG" alt="" />
        </div>
      </section>

      <section class="shoot" id="ecliptica">
        <h2 class="font-cursive">Ecliptica</h2>
        <p class="font-serif shoot-meta">14.11.2025</p>
        <div class="shoot-grid">
          <img src="/Ecliptica1.JPEG" alt="" />
          <img src="/Ecliptica2.JPEG" alt="" />
        </div>
      </section>

      <section class="shoot" id="lasalle">
        <h2 class="font-cursive">Lasalle<br />Fashion Show<br />2023</h2>
        <div class="shoot-grid">
          <img src="/LassalleFashionShow2023.png" alt="" />
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a class="wordmark font-cursive" href="/">Sami Makeup Art</a>
      <nav class="site-nav font-serif">
        <a href="/faces/">faces</a>
        <a href="/">art</a>
        <a href="/contact/">contact</a>
        <a href="/calendar/">calendar</a>
        <a href="/about-me/">about me</a>
      </nav>
    </footer>
  </body>
</html>
